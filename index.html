<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leon</title>
  <meta name="description" content="Leon — música, código y demás. Barcelona." />
  <meta name="theme-color" content="#0a0a0f" />
  <meta property="og:title" content="Leon" />
  <meta property="og:description" content="Música, código y demás. Barcelona." />
  <meta property="og:image" content="assets/img/avatar.jpg" />
  <link rel="icon" href="assets/img/avatar.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">

    <header class="hero">
      <div class="avatar"><img src="assets/img/avatar.jpg" alt="Leon" /></div>
      <h1>elfleoncha</h1>
      <p class="role">DEV · MÚSICA · BCN</p>
      <p class="bio">Poco a poco, lo pequeño se hace grande. 🎧</p>
      <nav class="links">
        <a href="https://instagram.com/fleon.priv" target="_blank" rel="noopener">Instagram</a>
        <a href="https://open.spotify.com/user/31wbdxst2paxfm4livotc7pe5q2m" target="_blank" rel="noopener">Spotify</a>
        <a href="https://github.com/elfleoncha" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <section class="player">
      <div class="disc">
        <img id="cover" src="assets/img/covers/512.jpg" alt="" />
      </div>

      <div class="now">
        <span class="label">SUENA AHORA</span>
        <strong id="nowPlaying">512 — Mora</strong>
      </div>

      <div class="bar">
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Progreso" />
        <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>

      <div class="controls">
        <button id="prev" class="btn" aria-label="Anterior"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 6h2v12H7zm10 0v12l-8-6z"/></svg></button>
        <button id="play" class="btn btn--main" aria-label="Reproducir"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" class="btn" aria-label="Siguiente"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15 6h2v12h-2zM7 6l8 6-8 6z"/></svg></button>
      </div>

      <ul class="tracks" id="tracks"></ul>

      <audio id="audio" preload="metadata"></audio>
    </section>

    <footer>
      <p>© <span id="year"></span> Leon · Barcelona</p>
    </footer>

  </main>
  <script src="js/script.js"></script>
</body>
</html>
